services:
  influxdb:
    image: influxdb:3.12.2-core
    restart: unless-stopped
    ports:
      - "127.0.0.1:8181:8181"
    command:
      - influxdb3
      - serve
      - --node-id=aether-pi
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
      - --http-bind=0.0.0.0:8181
    volumes:
      - influx-data:/var/lib/influxdb3/data
volumes:
  influx-data:
